name: render

on:
  push:
    branches: [main]
    paths: ["jobs/**", "pipeline/**", "assets/**", "episode.json", ".github/workflows/render.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Price history
        run: |
          git clone -q https://github.com/Bl4ckspell7/steam-case-prices.git src/prices
          git -C src/prices fetch -q origin data:data
          mkdir -p data build
          python pipeline/extract_history.py src/prices data/history.csv
          python pipeline/analyze.py > build/facts_summary.json

      - uses: actions/cache@v4
        with:
          path: tts_cache
          key: tts-${{ github.sha }}
          restore-keys: tts-

      - name: Narration (ElevenLabs)
        env:
          TTS: elevenlabs
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: for j in $(ls jobs); do python pipeline/voice.py "$j"; done

      - name: Render
        run: |
          for j in $(ls jobs); do python pipeline/render.py "$j" full; done
          python pipeline/thumb.py

      - name: Publish to renders branch
        run: |
          mkdir -p out
          for j in $(ls jobs); do
            ffmpeg -loglevel error -y -i build/$j/video.mp4 -c:v libx264 -preset medium -crf 26 -c:a copy -movflags +faststart out/$j.mp4
            cp build/$j/captions.srt out/$j.srt
          done
          cp build/thumbnail.png out/thumbnail.png
          cp build/facts.json out/facts.json
          cd out
          git init -q -b renders
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Render ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" renders
