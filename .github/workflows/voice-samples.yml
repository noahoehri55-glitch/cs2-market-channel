name: voice-samples

on:
  push:
    branches: [main]
    paths: ["samples.json", "pipeline/voice_samples.py", ".github/workflows/voice-samples.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python pipeline/voice_samples.py
      - name: Publish to samples branch
        run: |
          cd samples
          git init -q -b samples
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Voice samples ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" samples
